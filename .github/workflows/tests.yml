name: production-quality

on:
  push:
    branches: ["main", "refactor/**", "fix/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: test / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q .

      - name: Tests
        run: python -m pytest -q

      - name: Pyflakes
        run: python -m pyflakes .

      - name: Ruff
        run: python -m ruff check .

  android-deployment:
    name: android deployment scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n android/bootstrap.sh
          bash -n android/install-service.sh
          bash -n android/install-boot.sh
          bash -n android/status.sh
          bash -n android/start.sh
          bash -n android/stop.sh
          bash -n android/backup.sh

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pip_audit -r requirements.txt

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: parsing2026:test
